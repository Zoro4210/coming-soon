<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffefa" />
    <meta name="description" content="Vectiloom — coming soon." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fffefa'/%3E%3Ccircle cx='18' cy='46' r='8' fill='%23ff7926'/%3E%3Cg stroke='%23704ad8' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M22 37 27 18'/%3E%3Cpath d='m27 38 13-21'/%3E%3Cpath d='m30 42 21-10'/%3E%3Cpath d='m29 47 21 2'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Vectiloom</title>
  </head>
  <body>
    <main class="canvas">
      <video class="canvas__video" autoplay muted loop playsinline preload="auto" poster="./assets/doodle-poster.jpg" aria-hidden="true">
        <source src="./assets/doodle-loop.mp4" type="video/mp4" />
      </video>

      <section class="brand-reveal" id="brandReveal" aria-label="Vectiloom launch countdown">
        <img class="brand-reveal__logo" src="./assets/vectiloom-wordmark.png" alt="Vectiloom" />
        <button class="brand-reveal__emblem-trigger" id="emblemTrigger" type="button" aria-label="Show launch countdown" aria-expanded="false"></button>
        <div class="countdown" id="countdown" role="timer" aria-hidden="true">
          <span class="countdown__unit" aria-hidden="true">
            <span class="countdown__number" data-countdown="days">29</span>
            <span class="countdown__label">D</span>
          </span>
          <span class="countdown__separator" aria-hidden="true">:</span>
          <span class="countdown__unit" aria-hidden="true">
            <span class="countdown__number" data-countdown="hours">00</span>
            <span class="countdown__label">H</span>
          </span>
          <span class="countdown__separator" aria-hidden="true">:</span>
          <span class="countdown__unit" aria-hidden="true">
            <span class="countdown__number" data-countdown="minutes">00</span>
            <span class="countdown__label">M</span>
          </span>
          <span class="countdown__separator" aria-hidden="true">:</span>
          <span class="countdown__unit" aria-hidden="true">
            <span class="countdown__number" data-countdown="seconds">00</span>
            <span class="countdown__label">S</span>
          </span>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
